# Tests and lints on every push and PR.
#
# Separate from release.yml, which is generated by cargo-dist and only fires on
# a version tag — that one builds artifacts and never runs a test, so a build
# badge pointing at it would report the last *release* rather than the last
# commit and sit stale in between.
#
# There is deliberately no `cargo fmt --check` job: the tree is not currently
# rustfmt-clean, so adding one would fail on the first run. Reformat first if
# you want it, in its own commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, because the TUI's clipboard path shells out to `pbcopy` and the
        # config paths are built from $HOME — neither is exercised by Linux alone.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # `rust-version` is a promise, so it gets tested rather than asserted. The
  # toolchain is read out of Cargo.toml so there is one source of truth, and the
  # README's badge is checked against it — a static badge is the one thing here
  # that can silently drift out of date, so it drifts into a red build instead.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: README badge matches Cargo.toml
        run: grep -q "MSRV-${{ steps.msrv.outputs.version }}-" README.md
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # Catches an `include` in Cargo.toml that drops something the build needs:
  # this compiles the crate from the packaged tarball alone, not the worktree.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package
