[package]
name = "ichigo"
version = "0.3.9"
edition = "2024"
description = "A CLI HTTP client — store named request configs in your project or globally, then run them by name or through the TUI"
license = "MIT"
# Found by bisecting real toolchains, not by reading the edition. Edition 2024
# floors at 1.85 and the let-chains want 1.88, but `Duration::from_mins` in
# src/utils.rs was unstable until 1.91 — 1.90 fails to compile. Anything that
# lowers this has to be re-bisected; anything that raises it is a breaking
# change for someone on an older toolchain.
rust-version = "1.91"
repository = "https://github.com/playsthisgame/ichigo"
homepage = "https://github.com/playsthisgame/ichigo"
keywords = ["http", "cli", "rest", "client", "requests"]
categories = ["command-line-utilities", "web-programming::http-client"]
# An allowlist, because the default is "everything git does not ignore" — which
# swept `.claude/`, `.melon/`, `openspec/`, and a 347 KB screenshot into the
# 0.3.0 tarball and made it 503 KB. Nothing here is needed to build the crate,
# so anything added to it should be. That is also what keeps `assets/` — now a
# demo video as well as the screenshot — off the tarball entirely: the README
# points at both by absolute raw.githubusercontent URL, so they render from
# GitHub and weigh nothing here. Adding `assets/**` would put a video in every
# `cargo install`.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "ichigo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
anyhow = "1"
colored = "2"
colored_json = "5"
ratatui = "0.29"
crossterm = "0.28"
serde_yaml_ng = "0.10.0"
basic-toml = "0.1.10"
# 8.x is the last line that targets ratatui 0.29; 10.x and 11.x require 0.30, so
# bumping this is a ratatui migration and not a version bump. `default-features`
# is off because the default set includes `image-defaults` (= `image/default`),
# which pulls the AVIF encoder — ravif, rayon, and a few dozen crates — to
# decode formats no HTTP response is going to hand us. The formats we do want
# are named on our own `image` dependency below, and feature unification merges
# the two. Keep `crossterm` on: it is what selects ratatui's backend.
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }
# Must stay on the same major as ratatui-image's own `image` (^0.25.6) — a
# mismatch makes the two `DynamicImage` types distinct and `new_resize_protocol`
# stops accepting ours.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
